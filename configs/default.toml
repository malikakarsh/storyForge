seed = 2026

[data]
dataset = "roneneldan/TinyStories"
train_split = "train"
validation_split = "validation"
train_stories = 100000
validation_stories = 2000

[tokenizer]
vocab_size = 8192
min_frequency = 2
unk_token = "<unk>"
eos_token = "<eos>"
path = "artifacts/tokenizer.json"

[encoding]
batch_size = 512
train_path = "artifacts/train_tokens.npy"
validation_path = "artifacts/val_tokens.npy"

[training]
batch_size = 8

[model]
max_context = 256
d_model = 384
n_head = 6
mlp_multiplier = 4
dropout = 0.1
n_layer = 6

[overfit]
batch_size = 2
context = 32
steps = 500
learning_rate = 0.001
weight_decay = 0.0
target_loss = 0.02

[evaluation]
batch_size = 8
target_tokens = 32768

[generation]
prompts = [
    "One night, a little cat named Luna saw a spaceship in the garden.",
    "Milo the cat called his friends together. They had a secret plan.",
    "The cats wanted to rule the world, but first they needed",
]
max_new_tokens = 150
temperature = 0.8
top_k = 50
seed = 100
samples_path = "runs/baseline/samples.json"

[logging]
metrics_path = "runs/baseline/metrics.jsonl"
loss_plot_path = "runs/baseline/loss_curves.png"

[checkpoints]
initial_path = "runs/baseline/initial.pt"
