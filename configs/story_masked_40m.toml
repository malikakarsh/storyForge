seed = 2026

[data]
dataset = "roneneldan/TinyStories"
train_split = "train"
validation_split = "validation"
train_stories = 100000
validation_stories = 2000

[tokenizer]
vocab_size = 8192
min_frequency = 2
unk_token = "<unk>"
eos_token = "<eos>"
path = "artifacts/tokenizer.json"

[encoding]
batch_size = 512
train_path = "artifacts/train_tokens.npy"
validation_path = "artifacts/val_tokens.npy"

[training]
batch_size = 8
gradient_accumulation_steps = 8
token_budget = 40000000
log_every = 10

learning_rate = 0.0003
min_learning_rate = 0.00003
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95

lr_schedule = "cosine"
warmup_steps = 100
gradient_clip = 1.0
eval_every = 100

[model]
max_context = 256
d_model = 384
n_head = 6
mlp_multiplier = 4
dropout = 0.1
n_layer = 6
story_boundary_masking = true

[overfit]
batch_size = 2
context = 32
steps = 500
learning_rate = 0.001
weight_decay = 0.0
target_loss = 0.02

[evaluation]
batch_size = 8
target_tokens = 32768

[generation]
prompts = [
    "One night, a little cat named Luna saw a spaceship in the garden.",
    "Milo the cat called his friends together. They had a secret plan.",
    "The cats wanted to rule the world, but first they needed",
]
max_new_tokens = 150
temperature = 0.8
top_k = 50
seed = 100
samples_path = "runs/story_masked_40m/samples.json"

[logging]
metrics_path = "runs/story_masked_40m/metrics.jsonl"
loss_plot_path = "runs/story_masked_40m/loss_curves.png"
summary_path = "runs/story_masked_40m/summary.json"

[checkpoints]
initial_path = "runs/baseline/initial.pt"
best_path = "runs/story_masked_40m/best.pt"
last_path = "runs/story_masked_40m/last.pt"

[profiling]
updates = 10
sample_interval_seconds = 0.01
output_path = "runs/story_masked_40m/memory_profile.json"